syntax = "proto3";

package process;

option go_package = "github.com/gsoultan/metis/api/proto/entities;entities";

// Flow is one sequence flow: an arrow from one node to another, optionally
// guarded by a condition.
//
// The endpoints refer to nodes by id rather than embedding them. Embedding a
// whole Node here said the arrow owned a copy of the thing it points at, which
// is not what a flow is, and it made this file import node.proto — so a node
// could not in turn hold the flows of its sub-process without a cycle.
message Flow {
  string id = 1;
  string source_ref = 2;
  string target_ref = 3;
  string condition = 4;
  string documentation = 5;

  // The route the edge was drawn along. BPMN needs at least two points on an
  // edge; an empty list means the flow came from somewhere with no diagram and
  // the exporter has to draw a straight line instead.
  repeated Waypoint waypoints = 6;
}

// Waypoint is one point on a sequence flow's drawn route.
message Waypoint {
  int32 x = 1;
  int32 y = 2;
}
